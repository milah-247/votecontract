name: Bug report
description: Something in the contract behaves incorrectly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "**Security issues must not be filed here.** See SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Function called, arguments, and the result you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Ideally a failing Soroban unit test.
      render: rust
  - type: input
    id: commit
    attributes:
      label: Commit or version
