name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain, components and wasm target.
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # soroban-sdk 29 only builds WASM through the Stellar CLI (v25.2+).
      - uses: stellar/stellar-cli@v28.0.0
      - name: Build contract
        run: stellar contract build --locked
      - name: Report WASM size
        run: ls -l target/wasm32v1-none/release/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: ballot-wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
